<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI股票助手</title>

    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 12px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .loading {
            color: #888;
        }

    </style>

</head>


<body>

<div class="container">


<h1>📈 AI股票助手</h1>


<div class="card">

<div class="title">
市场状态
</div>

<p>
更新时间：
<span class="loading">
等待行情接入
</span>
</p>

<p>
市场温度：
<span class="loading">
等待计算
</span>
</p>

</div>



<div class="card">

<div class="title">
我的持仓
</div>

<p class="loading">
等待读取持仓数据...
</p>


</div>



<div class="card">

<div class="title">
今日候选股票
</div>

<p class="loading">
等待市场扫描...
</p>


</div>



<div class="card">

<div class="title">
AI分析建议
</div>

<p class="loading">
等待AI分析...
</p>


</div>


</div>

<script src="script.js"></script>
</body>

</html>
